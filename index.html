<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Семейный диспетчер — обновление</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f0e7;color:#2e302b}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{max-width:620px;background:#fff;border:1px solid #ded7cc;border-radius:24px;padding:32px;box-shadow:0 18px 50px rgba(47,42,35,.08)}
    h1{font-size:clamp(28px,6vw,44px);margin:0 0 16px}
    p{font-size:18px;line-height:1.55;margin:0}
  </style>
</head>
<body>
  <main>
    <h1>Семейный диспетчер</h1>
    <p>Обновляем защищённую рабочую версию. Семейные данные на этой странице и в публичном коде не хранятся.</p>
  </main>
</body>
</html>
